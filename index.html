<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winterwandel</title>
<meta name="description" content="Dein Winterwandel: Gewohnheiten abhaken, Tage zählen, dranbleiben.">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Winterwandel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-32.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<style>
/* Winterwandel – eine Datei, Daten nur auf dem Gerät (localStorage). */
@font-face { font-family:'Manrope'; font-style:normal; font-weight:200 800; font-display:swap; src:url(fonts/Manrope-latinext.woff2) format('woff2');
  unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+20A0-20AB, U+20AD-20C4; }
@font-face { font-family:'Manrope'; font-style:normal; font-weight:200 800; font-display:swap; src:url(fonts/Manrope-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root{
  --bg:#070b14; --panel:#0f1726; --panel2:#17223a; --line:rgba(200,225,255,.12);
  --text:#eaf2fc; --dim:rgba(220,234,250,.62); --ice:#8fd0ff; --ice2:#cfeaff; --ice-d:#3b7fb8;
  --ok:#7fe0c4; --bad:#ff8a80; --shadow:0 8px 28px rgba(0,0,0,.45);
  --nav-h:64px; --r:18px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--text); }
body{
  font-family:'Manrope', system-ui, sans-serif; font-size:16px; line-height:1.45; font-weight:500;
  min-height:100vh; padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  overscroll-behavior:none;
  background:radial-gradient(120% 60% at 50% -10%, #12284a 0%, rgba(7,11,20,0) 60%) var(--bg) no-repeat;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
input,select,textarea{ font:inherit; color:var(--text); }
.wrap{ position:relative; z-index:1; max-width:640px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px 0; }

/* Schnee */
#snow{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
#snow i{ position:absolute; top:-10px; width:var(--s); height:var(--s); border-radius:50%; background:#fff; opacity:var(--o);
  animation:fall var(--t) linear var(--d) infinite; filter:blur(.4px); }
@keyframes fall{ to{ transform:translate(var(--x), 105vh); } }
@media (prefers-reduced-motion: reduce){ #snow{ display:none; } }
body.no-snow #snow{ display:none; }

header.top{ display:flex; align-items:center; gap:6px; margin-bottom:14px; }
header.top h1{ font-size:24px; font-weight:800; letter-spacing:-.01em; margin:0; flex:1; display:flex; align-items:center; gap:8px; }
header.top h1 svg{ width:22px; height:22px; color:var(--ice); }
.icon-btn{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--ice2); }
.icon-btn:active{ background:var(--panel2); }
.icon-btn svg{ width:22px; height:22px; }

/* Karte */
.arc{ background:linear-gradient(160deg, #13284a 0%, #0f1726 70%); border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:var(--shadow); }
.arc .day{ font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ice); }
.arc .big{ font-size:40px; font-weight:800; line-height:1.05; margin:4px 0 2px; letter-spacing:-.02em; }
.arc .big small{ font-size:18px; font-weight:600; color:var(--dim); }
.bar{ height:8px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; margin:12px 0 10px; }
.bar b{ display:block; height:100%; background:linear-gradient(90deg, var(--ice-d), var(--ice), #fff); border-radius:99px; }
.arc .row{ display:flex; gap:8px; }
.arc .row div{ flex:1; background:rgba(255,255,255,.05); border-radius:12px; padding:8px 6px; text-align:center; }
.arc .row b{ display:block; font-size:20px; font-weight:800; }
.arc .row span{ font-size:11.5px; color:var(--dim); font-weight:600; }
.arc .why{ margin-top:12px; font-size:14px; color:var(--ice2); font-style:italic; }
.arc .why::before{ content:'Mein Warum: '; font-style:normal; font-weight:700; color:var(--dim); }
.quote{ margin:14px 4px 0; color:var(--dim); font-size:14.5px; }
.quote b{ color:var(--text); font-weight:700; }

.daynav{ display:flex; align-items:center; justify-content:space-between; background:var(--panel); border-radius:var(--r); padding:6px; margin-top:16px; border:1px solid var(--line); }
.daynav .lbl{ text-align:center; }
.daynav .lbl b{ display:block; font-weight:800; font-size:17px; }
.daynav .lbl span{ color:var(--dim); font-size:13.5px; }
.daynav button:disabled{ opacity:.25; cursor:default; }

.summary{ display:flex; align-items:center; gap:14px; margin:16px 2px; }
.ring{ width:64px; height:64px; flex:none; }
.ring circle{ fill:none; stroke-width:7; }
.ring .bg{ stroke:var(--line); }
.ring .fg{ stroke:var(--ice); stroke-linecap:round; transition:stroke-dashoffset .4s; transform:rotate(-90deg); transform-origin:50% 50%; }
.ring text{ fill:var(--text); font-size:17px; font-weight:800; text-anchor:middle; dominant-baseline:central; font-family:inherit; }
.summary p{ margin:0; color:var(--dim); font-size:14.5px; }
.summary p b{ color:var(--text); font-weight:800; font-size:18px; display:block; }

h2{ font-weight:800; font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ice); margin:22px 4px 8px; }

.list{ display:flex; flex-direction:column; gap:10px; }
.habit{
  display:flex; align-items:center; gap:12px; background:var(--panel); border-radius:var(--r);
  padding:12px 12px 12px 14px; border:1px solid var(--line); border-left:4px solid var(--c, var(--ice));
}
.habit .info{ flex:1; min-width:0; cursor:pointer; }
.habit .name{ font-size:16.5px; font-weight:700; overflow-wrap:anywhere; }
.habit .meta{ color:var(--dim); font-size:13px; display:flex; gap:10px; flex-wrap:wrap; font-weight:600; }
.habit .meta .streak{ color:var(--ice2); }
.habit.off{ opacity:.5; }
.check{
  width:46px; height:46px; border-radius:50%; flex:none; border:2px solid var(--c, var(--ice));
  display:grid; place-items:center; transition:background .2s, transform .15s, box-shadow .2s;
}
.check svg{ width:24px; height:24px; stroke:var(--bg); stroke-width:3.2; fill:none; opacity:0; transition:opacity .2s; }
.check.done{ background:var(--c, var(--ice)); box-shadow:0 0 18px color-mix(in srgb, var(--c, var(--ice)) 55%, transparent); }
.check.done svg{ opacity:1; }
.check:active{ transform:scale(.92); }
.check.pop{ animation:pop .35s ease; }
@keyframes pop{ 50%{ transform:scale(1.18); } }

.empty{ text-align:center; color:var(--dim); padding:28px 16px; background:var(--panel); border-radius:var(--r); border:1px solid var(--line); }
.empty b{ display:block; color:var(--text); font-weight:800; font-size:18px; margin-bottom:6px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 18px; border-radius:14px;
  background:linear-gradient(180deg, #bfe6ff, var(--ice)); color:#06111f; font-weight:800; font-size:15px; }
.btn.ghost{ background:transparent; color:var(--ice2); border:1px solid rgba(143,208,255,.45); font-weight:700; }
.btn.danger{ background:transparent; color:var(--bad); border:1px solid var(--bad); font-weight:700; }
.btn.wide{ width:100%; }
.add-row{ margin-top:14px; }

/* Woche */
.week{ background:var(--panel); border-radius:var(--r); padding:10px; border:1px solid var(--line); overflow-x:auto; }
.week table{ width:100%; border-collapse:collapse; }
.week th{ font-weight:700; color:var(--dim); font-size:12.5px; padding:4px 2px; }
.week th.today{ color:var(--ice); }
.week td{ padding:5px 2px; text-align:center; border-top:1px solid var(--line); }
.week td.n{ text-align:left; padding-right:8px; max-width:120px; font-size:14.5px; font-weight:700; overflow-wrap:anywhere; }
.cell{ width:30px; height:30px; border-radius:9px; border:1.5px solid var(--c, var(--ice)); display:inline-grid; place-items:center; }
.cell.done{ background:var(--c, var(--ice)); }
.cell.done::after{ content:''; width:10px; height:5px; border:solid var(--bg); border-width:0 0 2.5px 2.5px; transform:rotate(-45deg) translate(1px,-1px); }
.cell.off{ border-style:dashed; opacity:.35; }
.cell.future{ opacity:.12; cursor:default; }
.week .cnt{ color:var(--dim); font-size:12.5px; font-weight:700; }

/* Statistik */
.card{ background:var(--panel); border-radius:var(--r); padding:14px; border:1px solid var(--line); }
.stat{ border-left:4px solid var(--c); }
.stat .head{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.stat .head b{ font-weight:800; font-size:16.5px; }
.nums{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:10px 0; text-align:center; }
.nums div{ background:var(--panel2); border-radius:10px; padding:8px 4px; }
.nums b{ display:block; font-weight:800; font-size:20px; color:var(--ice2); }
.nums span{ font-size:11.5px; color:var(--dim); font-weight:600; }
.heat{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 1fr); gap:3px; }
.heat i{ aspect-ratio:1; border-radius:3px; background:var(--line); }
.heat i.d{ background:var(--c); }
.heat i.o{ background:transparent; outline:1px dashed var(--line); outline-offset:-1px; }
.heat i.f{ visibility:hidden; }
.heat-lbl{ display:flex; justify-content:space-between; color:var(--dim); font-size:11.5px; margin-top:4px; font-weight:600; }
.arcgrid{ display:grid; grid-template-columns:repeat(10, 1fr); gap:4px; margin-top:10px; }
.arcgrid i{ aspect-ratio:1; border-radius:5px; background:rgba(255,255,255,.06); position:relative; }
.arcgrid i[data-l="1"]{ background:#1d3b5e; } .arcgrid i[data-l="2"]{ background:#2e6596; }
.arcgrid i[data-l="3"]{ background:#5aa7e0; } .arcgrid i[data-l="4"]{ background:#cfeaff; box-shadow:0 0 8px rgba(207,234,255,.6); }
.arcgrid i.today{ outline:2px solid var(--ice); outline-offset:1px; }
.arcgrid i.fut{ background:transparent; outline:1px dashed var(--line); outline-offset:-1px; }
.legend{ display:flex; align-items:center; gap:4px; justify-content:flex-end; color:var(--dim); font-size:11.5px; margin-top:8px; font-weight:600; }
.legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; }

/* Leiste */
nav.bar{ position:fixed; left:0; right:0; bottom:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom); background:rgba(10,16,30,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line); display:flex; justify-content:center; z-index:20; }
nav.bar button{ flex:1; max-width:160px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--dim); font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
nav.bar button svg{ width:24px; height:24px; }
nav.bar button.on{ color:var(--ice); }

/* Fenster */
.backdrop{ position:fixed; inset:0; background:rgba(2,5,12,.7); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.backdrop[hidden]{ display:none; }
.sheet{ background:var(--panel); width:100%; max-width:560px; border-radius:24px 24px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:92vh; overflow:auto; animation:up .22s ease; border:1px solid var(--line); border-bottom:0; }
@media (min-width:600px){ .backdrop{ align-items:center; } .sheet{ border-radius:24px; border-bottom:1px solid var(--line); } }
@keyframes up{ from{ transform:translateY(30px); opacity:0; } }
.sheet h3{ margin:0 0 14px; font-weight:800; font-size:21px; }
.field{ margin-bottom:14px; }
.field > label{ display:block; color:var(--dim); font-size:13.5px; font-weight:700; margin-bottom:6px; }
.field input[type=text], .field input[type=date], .field textarea{
  width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); font-size:16px; color-scheme:dark; }
.field textarea{ resize:vertical; min-height:70px; }
.seg{ display:flex; gap:6px; flex-wrap:wrap; }
.seg button{ padding:9px 12px; border-radius:999px; border:1px solid var(--line); font-size:14px; font-weight:700; }
.seg button.on{ background:var(--ice); color:#06111f; border-color:var(--ice); }
.days button{ width:42px; padding:9px 0; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chips button{ padding:8px 12px; border-radius:999px; border:1px dashed rgba(143,208,255,.5); font-size:14px; font-weight:700; color:var(--ice2); }
.chips button.on{ border-style:solid; background:rgba(143,208,255,.16); }
.chips button.on::before{ content:'✓ '; }
.colors{ display:flex; gap:10px; flex-wrap:wrap; }
.colors button{ width:34px; height:34px; border-radius:50%; background:var(--c); outline-offset:3px; }
.colors button.on{ outline:2px solid var(--text); }
.row-btns{ display:flex; gap:10px; margin-top:8px; }
.row-btns .btn{ flex:1; }
.small-btns{ display:flex; gap:8px; margin-top:12px; }
.small-btns .btn{ flex:1; padding:9px 8px; font-size:13px; }
.note{ color:var(--dim); font-size:13.5px; }
.toast{ position:fixed; left:50%; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); transform:translateX(-50%);
  background:var(--ice2); color:#06111f; padding:10px 16px; border-radius:999px; font-size:15px; font-weight:700; z-index:60; box-shadow:var(--shadow);
  max-width:calc(100% - 32px); text-align:center; }
.toast[hidden]{ display:none; }
.footer{ text-align:center; color:var(--dim); font-size:12px; margin:28px 0 8px; }

/* Start */
.intro{ text-align:center; padding:24px 6px 0; }
.intro .flake{ width:64px; height:64px; color:var(--ice); filter:drop-shadow(0 0 16px rgba(143,208,255,.6)); }
.intro h2{ font-size:34px; letter-spacing:-.02em; text-transform:none; color:var(--text); margin:10px 0 6px; }
.intro p{ color:var(--dim); margin:0 0 20px; }
.intro .card{ text-align:left; }
</style>
</head>
<body>
<div id="snow" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <h1 id="title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5M4 10.2l3.8-.7L6.5 6M20 13.8l-3.8.7 1.3 3.5M4 13.8l3.8.7L6.5 18M20 10.2l-3.8-.7L17.5 6"/></svg><span>Winterwandel</span></h1>
    <button class="icon-btn" id="add-top" aria-label="Gewohnheit hinzufügen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="settings-btn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main id="view"></main>
  <div class="footer">Deine Daten bleiben nur auf diesem Gerät. · <span id="ver"></span></div>
</div>

<nav class="bar">
  <button data-tab="today" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>Heute</button>
  <button data-tab="week">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Woche</button>
  <button data-tab="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-10 4 6 3-4 5 8z"/></svg>Mein Wandel</button>
</nav>

<div class="backdrop" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const VERSION = '2.0.0';
const KEY = 'winterarc_v1';
const COLORS = ['#8fd0ff','#7fe0c4','#b9a7ff','#ff9fb2','#ffd08a','#6fa8ff','#e8f1fb','#9be37a'];
const WD_SHORT = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const SUGGEST = ['Vor 7 Uhr aufstehen','Training','2 Liter Wasser','10 Seiten lesen','Kalt duschen','Kein Zucker','10.000 Schritte','Tagebuch schreiben','Kein Handy nach 22 Uhr','Meditieren'];
const QUOTES = [
  'Disziplin ist, das zu tun, was du dir vorgenommen hast – auch wenn die Lust weg ist.',
  'Während andere auf den Frühling warten, baust du dich neu.',
  'Kleine Schritte jeden Tag schlagen große Pläne einmal im Monat.',
  'Du musst nicht motiviert sein. Du musst nur anfangen.',
  'Der Winter ist kalt. Dein Wille nicht.',
  'Niemand sieht das Training im Dunkeln. Alle sehen das Ergebnis im Licht.',
  'Ein verpasster Tag ist ein Ausrutscher. Zwei sind ein neues Muster. Steh wieder auf.',
  'Heute zählt. Nicht gestern, nicht morgen.',
  'Dein zukünftiges Ich schaut dir gerade zu.',
  'Ruhe ist kein Rückschritt. Aufgeben schon.',
  'Stark wird man nicht an guten Tagen.',
  'Mach es einfach. Dann mach es wieder.'
];

/* ---------- Daten ---------- */
// state = { arc:{start:'YYYY-MM-DD', days:n, why:''}|null, habits:[{id,name,color,mode,days,times,created,archived}], marks:{'YYYY-MM-DD':[ids]}, weekStart:1, snow:true }
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(s && Array.isArray(s.habits)) return { arc:s.arc || null, habits:s.habits, marks:s.marks || {}, weekStart: s.weekStart === 0 ? 0 : 1, snow: s.snow !== false };
  }catch(e){}
  return { arc:null, habits:[], marks:{}, weekStart:1, snow:true };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Speichern nicht möglich – Speicher voll?'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- Datum ---------- */
const pad = n => String(n).padStart(2,'0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const daysBetween = (a, b) => Math.round((b - a) / 864e5);
function weekStartOf(d){ const x = new Date(d); x.setHours(0,0,0,0); const diff = (x.getDay() - state.weekStart + 7) % 7; return addDays(x, -diff); }
function longDate(d){ return WD_SHORT[d.getDay()] + ', ' + d.getDate() + '. ' + MONTHS[d.getMonth()]; }
const shortDate = d => d.getDate() + '.' + (d.getMonth()+1) + '.';

/* ---------- Winterwandel ---------- */
function arcInfo(){
  const a = state.arc; if(!a) return null;
  const s = fromKey(a.start), e = addDays(s, a.days - 1), t = today();
  const day = daysBetween(s, t) + 1;   // 1 … days
  return { start:s, end:e, total:a.days, day, before: day < 1, over: day > a.days, left: Math.max(0, daysBetween(t, e)) };
}
// Anteil erledigter fälliger Gewohnheiten an einem Tag (null = nichts fällig)
function dayScore(d){
  const k = dkey(d); let need = 0, got = 0;
  for(const h of activeHabits()){
    if(!isDue(h, d)) continue;
    if(h.mode === 'times' && !isDone(h, k)) continue; // x-mal pro Woche: freier Tag zählt nicht gegen dich
    need++; if(isDone(h, k)) got++;
  }
  return need ? got / need : null;
}
const perfect = d => { const s = dayScore(d); return s !== null && s >= 1; };
function arcStats(){
  const A = arcInfo(); if(!A || A.before) return { perfect:0, streak:0 };
  const t = today(), last = A.over ? A.end : t;
  let n = 0;
  for(let d = new Date(A.start); d <= last; d = addDays(d, 1)) if(perfect(d)) n++;
  let st = 0, d = new Date(last);
  if(!A.over && !perfect(d)) d = addDays(d, -1);
  while(d >= A.start && perfect(d)){ st++; d = addDays(d, -1); }
  return { perfect:n, streak:st };
}

/* ---------- Gewohnheiten ---------- */
const isDone = (h, k) => (state.marks[k] || []).includes(h.id);
function setDone(h, k, on){
  const arr = (state.marks[k] || []).filter(id => id !== h.id);
  if(on) arr.push(h.id);
  if(arr.length) state.marks[k] = arr; else delete state.marks[k];
  save();
}
function isDue(h, d){
  if(dkey(d) < h.created) return false;
  if(h.mode === 'days') return h.days.includes(d.getDay());
  return true;
}
function weekCount(h, d){ const s = weekStartOf(d); let n = 0; for(let i=0;i<7;i++) if(isDone(h, dkey(addDays(s,i)))) n++; return n; }
const weekMet = (h, d) => weekCount(h, d) >= h.times;

function streak(h){
  const t = today();
  if(h.mode === 'times'){
    let w = weekStartOf(t), n = 0;
    if(!weekMet(h, w)) w = addDays(w, -7);
    while(dkey(addDays(w,6)) >= h.created && weekMet(h, w)){ n++; w = addDays(w, -7); }
    return n;
  }
  let d = t, n = 0;
  if(isDue(h, d) && !isDone(h, dkey(d))) d = addDays(d, -1);
  for(let g=0; g<3700; g++){
    const k = dkey(d);
    if(k < h.created) break;
    if(isDue(h, d)){ if(isDone(h, k)) n++; else break; }
    else if(isDone(h, k)) n++;
    d = addDays(d, -1);
  }
  return n;
}
function bestStreak(h){
  const t = today();
  if(h.mode === 'times'){
    let w = weekStartOf(fromKey(h.created)), best = 0, cur = 0;
    while(w <= t){ if(weekMet(h, w)){ cur++; best = Math.max(best, cur); } else if(addDays(w,6) < t) cur = 0; w = addDays(w, 7); }
    return best;
  }
  let d = fromKey(h.created), best = 0, cur = 0;
  while(d <= t){
    const k = dkey(d);
    if(isDone(h, k)){ cur++; best = Math.max(best, cur); }
    else if(isDue(h, d) && k !== dkey(t)) cur = 0;
    d = addDays(d, 1);
  }
  return best;
}
function rate30(h){
  const t = today();
  if(h.mode === 'times'){
    let got = 0, need = 0;
    for(let i=0;i<4;i++){
      const w = addDays(weekStartOf(t), -7*i);
      if(dkey(addDays(w,6)) < h.created) break;
      got += Math.min(weekCount(h, w), h.times); need += h.times;
    }
    return need ? Math.round(got/need*100) : null;
  }
  let got = 0, need = 0;
  for(let i=0;i<30;i++){ const d = addDays(t, -i); if(isDue(h, d)){ need++; if(isDone(h, dkey(d))) got++; } }
  return need ? Math.round(got/need*100) : null;
}
function totalDone(h){ let n = 0; for(const k in state.marks) if(state.marks[k].includes(h.id)) n++; return n; }
function freqText(h){
  if(h.mode === 'daily') return 'Täglich';
  if(h.mode === 'times') return h.times + '× pro Woche';
  if(h.days.length === 7) return 'Täglich';
  return [1,2,3,4,5,6,0].filter(i => h.days.includes(i)).map(i => WD_SHORT[i]).join(' · ');
}
function streakText(h){
  const s = streak(h); if(!s) return '';
  if(h.mode === 'times') return s === 1 ? '1 Woche' : s + ' Wochen';
  return s === 1 ? '1 Tag' : s + ' Tage';
}
const activeHabits = () => state.habits.filter(h => !h.archived);
function addHabit(name, extra){
  state.habits.push(Object.assign({ id:uid(), name, color:COLORS[state.habits.length % COLORS.length], mode:'daily', days:[1,2,3,4,5], times:3, created:dkey(today()) }, extra || {}));
}

let tab = 'today', viewDay = today();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK_SVG = '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4 4L18.5 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const FLAKE = '<svg class="flake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5M4 10.2l3.8-.7L6.5 6M20 13.8l-3.8.7 1.3 3.5M4 13.8l3.8.7L6.5 18M20 10.2l-3.8-.7L17.5 6"/></svg>';
const ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>';

function render(){
  document.body.classList.toggle('no-snow', !state.snow);
  const setup = !state.arc;
  document.querySelector('nav.bar').style.display = setup ? 'none' : '';
  $('#add-top').style.visibility = setup ? 'hidden' : '';
  if(setup){ renderSetup(); return; }
  document.querySelectorAll('nav.bar button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));

/* Erster Start: einrichten */
let setupPick = new Set(['Training','2 Liter Wasser','10 Seiten lesen']);
let setupDays = 90, setupStart = null, setupWhy = '';
function renderSetup(){
  const t = today();
  if(!setupStart) setupStart = dkey(t);
  const end = addDays(fromKey(setupStart), setupDays - 1);
  const custom = state.habits.length ? '' :
    '<div class="field"><label>Womit startest du? (später änderbar)</label><div class="chips" id="su-chips">'
    + SUGGEST.map(s => '<button data-s="' + esc(s) + '" class="' + (setupPick.has(s) ? 'on' : '') + '">' + esc(s) + '</button>').join('') + '</div></div>';
  $('#view').innerHTML = '<div class="intro">' + FLAKE + '<h2>Dein Winterwandel</h2><p>Die dunkle Jahreszeit gehört dir. Leg fest, wie lange – und was du jeden Tag tust.</p>'
    + '<div class="card">'
    + '<div class="field"><label for="su-start">Start</label><input id="su-start" type="date" value="' + setupStart + '"></div>'
    + '<div class="field"><label>Dauer</label><div class="seg" id="su-days">' + [[30,'30 Tage'],[60,'60 Tage'],[90,'90 Tage'],[0,'Bis Silvester']].map(([v,l]) =>
        '<button data-v="' + v + '" class="' + ((v === 0 ? setupDays === untilNye() : setupDays === v) ? 'on' : '') + '">' + l + '</button>').join('') + '</div>'
      + '<p class="note" style="margin:8px 0 0">Ende: ' + longDate(end) + ' ' + end.getFullYear() + ' · ' + setupDays + ' Tage</p></div>'
    + '<div class="field"><label for="su-why">Mein Warum <span style="font-weight:500">(freiwillig)</span></label><textarea id="su-why" maxlength="160" placeholder="z. B. Ich will im Frühling stärker, ruhiger und fitter sein.">' + esc(setupWhy) + '</textarea></div>'
    + custom
    + '<button class="btn wide" data-act="arc-go">Winterwandel starten</button>'
    + '</div></div>';
  $('#su-start').onchange = e => { if(e.target.value){ setupStart = e.target.value; if(isNyeSel) setupDays = untilNye(); renderSetup(); } };
  $('#su-why').oninput = e => setupWhy = e.target.value;
  $('#su-days').onclick = e => { const b = e.target.closest('button'); if(!b) return; const v = +b.dataset.v; isNyeSel = v === 0; setupDays = v || untilNye(); renderSetup(); };
  if($('#su-chips')) $('#su-chips').onclick = e => { const b = e.target.closest('button'); if(!b) return; const s = b.dataset.s; setupPick.has(s) ? setupPick.delete(s) : setupPick.add(s); b.classList.toggle('on'); };
}
let isNyeSel = false;
function untilNye(){ const s = fromKey(setupStart || dkey(today())); let ny = new Date(s.getFullYear(), 11, 31); if(daysBetween(s, ny) < 6) ny = new Date(s.getFullYear()+1, 11, 31); return daysBetween(s, ny) + 1; }
function arcGo(){
  state.arc = { start:setupStart, days:Math.max(1, setupDays), why:(setupWhy || '').trim().slice(0,160) };
  if(!state.habits.length) for(const s of SUGGEST) if(setupPick.has(s)) addHabit(s, s === 'Training' ? { mode:'times', times:4 } : null);
  save(); tab = 'today'; viewDay = today(); render(); toast('Los geht’s. Tag 1 – der wichtigste.');
}

function arcCardHtml(){
  const A = arcInfo(), S = arcStats();
  let head, big, pct;
  if(A.before){ head = 'Startet bald'; big = 'in ' + (1 - A.day) + (1 - A.day === 1 ? ' Tag' : ' Tagen'); pct = 0; }
  else if(A.over){ head = 'Geschafft'; big = A.total + ' <small>von ' + A.total + ' Tagen</small>'; pct = 1; }
  else { head = 'Winterwandel · ' + shortDate(A.start) + ' – ' + shortDate(A.end); big = 'Tag ' + A.day + ' <small>von ' + A.total + '</small>'; pct = A.day / A.total; }
  return '<div class="arc"><div class="day">' + head + '</div><div class="big">' + big + '</div>'
    + '<div class="bar"><b style="width:' + Math.round(pct*100) + '%"></b></div>'
    + '<div class="row"><div><b>' + (A.over ? 0 : A.before ? A.total : A.left) + '</b><span>Tage übrig</span></div><div><b>' + S.perfect + '</b><span>perfekte Tage</span></div><div><b>' + S.streak + '</b><span>perfekt am Stück</span></div></div>'
    + (state.arc.why ? '<div class="why">' + esc(state.arc.why) + '</div>' : '')
    + (A.over ? '<div class="add-row"><button class="btn wide" data-act="new-arc">Neu starten</button></div>' : '')
    + '</div>';
}
function quoteHtml(){
  const n = Math.floor(today() / 864e5);
  return '<p class="quote"><b>Heute:</b> ' + QUOTES[n % QUOTES.length] + '</p>';
}

function emptyHtml(){
  return '<div class="empty"><b>Noch keine Gewohnheiten</b>Was gehört zu deinem Winterwandel? Training, früh aufstehen, lesen …<div class="add-row"><button class="btn" data-act="add">+ Gewohnheit anlegen</button></div></div>';
}

function renderToday(){
  const hs = activeHabits();
  const t = today(), k = dkey(viewDay), isToday = k === dkey(t);
  const label = isToday ? 'Heute' : (k === dkey(addDays(t,-1)) ? 'Gestern' : longDate(viewDay));
  let html = arcCardHtml() + (isToday ? quoteHtml() : '');
  html += '<div class="daynav"><button class="icon-btn" data-act="prev" aria-label="Vorheriger Tag">' + ARROW_L + '</button>'
    + '<div class="lbl"><b>' + label + '</b><span>' + (isToday ? longDate(viewDay) : 'Nachtragen') + '</span></div>'
    + '<button class="icon-btn" data-act="next" aria-label="Nächster Tag"' + (isToday ? ' disabled' : '') + '>' + ARROW_R + '</button></div>';
  if(!hs.length){ $('#view').innerHTML = html + '<div style="height:16px"></div>' + emptyHtml(); return; }

  const due = [], free = [];
  for(const h of hs){
    const open = isDue(h, viewDay) && !(h.mode === 'times' && weekMet(h, viewDay) && !isDone(h, k));
    (open || isDone(h, k) ? due : free).push(h);
  }
  const done = due.filter(h => isDone(h, k)).length, total = due.length;
  const pct = total ? done/total : 0, C = 2*Math.PI*26;
  const msg = !total ? 'Heute ist nichts fällig.' : done === total ? 'Perfekter Tag. ❄️' : done === 0 ? 'Fang mit dem Ersten an.' : 'Bleib dran.';
  html += '<div class="summary"><svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" cx="32" cy="32" r="26" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C*(1-pct)) + '"/><text x="32" y="32">' + done + '/' + total + '</text></svg>'
    + '<p><b>' + msg + '</b>' + (total ? Math.round(pct*100) + ' % erledigt' : '') + '</p></div>';
  html += '<div class="list">' + due.map(h => habitRow(h, k)).join('') + '</div>';
  if(free.length) html += '<h2>' + (isToday ? 'Heute frei' : 'An diesem Tag frei') + '</h2><div class="list">' + free.map(h => habitRow(h, k, true)).join('') + '</div>';
  html += '<div class="add-row"><button class="btn ghost wide" data-act="add">+ Gewohnheit</button></div>';
  $('#view').innerHTML = html;
}
function habitRow(h, k, off){
  const done = isDone(h, k);
  let meta = '<span>' + freqText(h) + '</span>';
  if(h.mode === 'times') meta += '<span>diese Woche ' + weekCount(h, fromKey(k)) + '/' + h.times + '</span>';
  const st = streakText(h);
  if(st) meta += '<span class="streak">🔥 ' + st + '</span>';
  return '<div class="habit' + (off ? ' off' : '') + '" style="--c:' + h.color + '">'
    + '<div class="info" data-act="edit" data-id="' + h.id + '"><div class="name">' + esc(h.name) + '</div><div class="meta">' + meta + '</div></div>'
    + '<button class="check' + (done ? ' done' : '') + '" data-act="toggle" data-id="' + h.id + '" data-k="' + k + '" aria-label="' + esc(h.name) + ' abhaken" aria-pressed="' + done + '">' + CHECK_SVG + '</button></div>';
}

let weekOffset = 0;
function renderWeek(){
  const hs = activeHabits();
  if(!hs.length){ $('#view').innerHTML = emptyHtml(); return; }
  const t = today(), s = addDays(weekStartOf(t), -7*weekOffset), e = addDays(s, 6);
  const days = [...Array(7)].map((_,i) => addDays(s,i));
  let html = '<div class="daynav" style="margin-top:0"><button class="icon-btn" data-act="wprev" aria-label="Vorherige Woche">' + ARROW_L + '</button>'
    + '<div class="lbl"><b>' + (weekOffset === 0 ? 'Diese Woche' : weekOffset === 1 ? 'Letzte Woche' : 'KW ' + isoWeek(addDays(s, (8 - s.getDay()) % 7))) + '</b><span>' + shortDate(s) + ' – ' + shortDate(e) + '</span></div>'
    + '<button class="icon-btn" data-act="wnext" aria-label="Nächste Woche"' + (weekOffset === 0 ? ' disabled' : '') + '>' + ARROW_R + '</button></div><div style="height:12px"></div>';
  html += '<div class="week"><table><tr><th></th>' + days.map(d => '<th class="' + (dkey(d) === dkey(t) ? 'today' : '') + '">' + WD_SHORT[d.getDay()] + '<br>' + d.getDate() + '</th>').join('') + '<th></th></tr>';
  for(const h of hs){
    let n = 0;
    html += '<tr style="--c:' + h.color + '"><td class="n">' + esc(h.name) + '</td>';
    for(const d of days){
      const k = dkey(d), fut = d > t, done = isDone(h, k), due = isDue(h, d);
      if(done) n++;
      html += '<td><button class="cell' + (done ? ' done' : '') + (fut ? ' future' : (!due ? ' off' : '')) + '"' + (fut ? ' disabled' : '') + ' data-act="toggle" data-id="' + h.id + '" data-k="' + k + '" aria-label="' + esc(h.name) + ' ' + WD_SHORT[d.getDay()] + '"></button></td>';
    }
    const goal = h.mode === 'times' ? h.times : days.filter(d => isDue(h, d)).length;
    html += '<td class="cnt">' + n + '/' + goal + '</td></tr>';
  }
  html += '</table></div><p class="note" style="margin:10px 4px">Tippe ein Kästchen, um einen Tag nachzutragen. Gestrichelt = an dem Tag nicht geplant.</p>';
  $('#view').innerHTML = html;
}
function isoWeek(d){
  const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil(((x - y0) / 864e5 + 1) / 7);
}

function renderStats(){
  const A = arcInfo(), t = today();
  let grid = '';
  for(let i=0;i<A.total;i++){
    const d = addDays(A.start, i), k = dkey(d);
    if(d > t){ grid += '<i class="fut" title="Tag ' + (i+1) + '"></i>'; continue; }
    const s = dayScore(d);
    const l = s === null ? 0 : s >= 1 ? 4 : s >= .66 ? 3 : s >= .33 ? 2 : s > 0 ? 1 : 0;
    grid += '<i data-l="' + l + '" class="' + (k === dkey(t) ? 'today' : '') + '" title="Tag ' + (i+1) + ' · ' + shortDate(d) + (s === null ? '' : ' · ' + Math.round(s*100) + ' %') + '"></i>';
  }
  let html = arcCardHtml()
    + '<h2>Jeder Tag deines Winterwandels</h2><div class="card"><div class="note">' + shortDate(A.start) + A.start.getFullYear() + ' – ' + shortDate(A.end) + A.end.getFullYear() + ' · ein Feld = ein Tag</div>'
    + '<div class="arcgrid">' + grid + '</div>'
    + '<div class="legend">wenig <i style="background:#1d3b5e"></i><i style="background:#2e6596"></i><i style="background:#5aa7e0"></i><i style="background:#cfeaff"></i> perfekt</div></div>';
  const hs = activeHabits();
  if(hs.length){
    const WEEKS = 17, start = addDays(weekStartOf(t), -7*(WEEKS-1));
    html += '<h2>Deine Gewohnheiten</h2><div class="list">';
    for(const h of hs){
      const r = rate30(h), unit = h.mode === 'times' ? 'Wochen' : 'Tage';
      let cells = '';
      for(let i=0;i<WEEKS*7;i++){
        const d = addDays(start, i), k = dkey(d);
        const cls = d > t ? 'f' : isDone(h, k) ? 'd' : (k < h.created || (h.mode === 'days' && !isDue(h, d))) ? 'o' : '';
        cells += '<i class="' + cls + '" title="' + k + '"></i>';
      }
      html += '<div class="card stat" style="--c:' + h.color + '"><div class="head"><b>' + esc(h.name) + '</b><span class="note">' + freqText(h) + '</span></div>'
        + '<div class="nums"><div><b>' + streak(h) + '</b><span>' + unit + ' am Stück</span></div><div><b>' + bestStreak(h) + '</b><span>Rekord</span></div><div><b>' + (r === null ? '–' : r + ' %') + '</b><span>letzte 30 Tage</span></div></div>'
        + '<div class="heat">' + cells + '</div><div class="heat-lbl"><span>vor ' + WEEKS + ' Wochen</span><span>' + totalDone(h) + '× erledigt</span><span>heute</span></div></div>';
    }
    html += '</div>';
  }
  $('#view').innerHTML = html;
}

  name.addEventListener('input', () => draft.name = name.value);
  name.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); saveDraft(); } });
  if($('#f-sugg')) $('#f-sugg').onclick = e => { const b = e.target.closest('button'); if(!b) return; draft.name = name.value = b.dataset.s; };
  $('#f-mode').onclick = e => { const b = e.target.closest('button'); if(!b) return; draft.mode = b.dataset.m; drawEdit(); };
  if($('#f-days')) $('#f-days').onclick = e => { const b = e.target.closest('button'); if(!b) return; const n = +b.dataset.d;
    draft.days = draft.days.includes(n) ? draft.days.filter(x => x !== n) : [...draft.days, n]; b.classList.toggle('on'); };
  if($('#f-times')) $('#f-times').onclick = e => { const b = e.target.closest('button'); if(!b) return; draft.times = +b.dataset.n; drawEdit(); };
  $('#f-color').onclick = e => { const b = e.target.closest('button'); if(!b) return; draft.color = b.dataset.c; drawEdit(); };
}
function saveDraft(){
  const d = draft, name = (d.name || '').trim();
  if(!name){ toast('Bitte einen Namen eingeben.'); $('#f-name').focus(); return; }
  if(d.mode === 'days' && !d.days.length){ toast('Bitte mindestens einen Tag wählen.'); return; }
  if(d.mode === 'days' && d.days.length === 7) d.mode = 'daily';
  const fields = { name, color:d.color, mode:d.mode, days:d.days.slice().sort(), times:d.times };
  if(d.id) Object.assign(state.habits.find(x => x.id === d.id), fields); else addHabit(name, fields);
  save(); closeSheet(); render();
}
function moveHabit(dir){
  const act = activeHabits(), i = act.findIndex(x => x.id === draft.id), j = i + dir;
  if(j < 0 || j >= act.length) return;
  const a = state.habits.indexOf(act[i]), b = state.habits.indexOf(act[j]);
  [state.habits[a], state.habits[b]] = [state.habits[b], state.habits[a]];
  save(); render(); drawEdit();
}
function deleteHabit(){
  const h = state.habits.find(x => x.id === draft.id);
  openSheet('<h3>Löschen?</h3><p>„' + esc(h.name) + '“ und alle ' + totalDone(h) + ' Haken werden gelöscht. Das lässt sich nicht rückgängig machen.</p>'
    + '<div class="row-btns"><button class="btn ghost" data-act="back">Abbrechen</button><button class="btn danger" data-act="delok">Löschen</button></div>');
}
function deleteConfirmed(){
  const id = draft.id;
  state.habits = state.habits.filter(x => x.id !== id);
  for(const k in state.marks){ state.marks[k] = state.marks[k].filter(x => x !== id); if(!state.marks[k].length) delete state.marks[k]; }
  save(); closeSheet(); render(); toast('Gelöscht.');
}

function openSettings(){
  const a = state.arc;
  openSheet('<h3>Einstellungen</h3>'
    + (a ? '<div class="field"><label for="s-why">Mein Warum</label><textarea id="s-why" maxlength="160">' + esc(a.why || '') + '</textarea></div>'
      + '<div class="field"><label>Dauer</label><div class="seg" id="s-len">' + [30,60,90,100].map(v => '<button data-v="' + v + '" class="' + (a.days === v ? 'on' : '') + '">' + v + ' Tage</button>').join('') + '</div>'
      + '<p class="note" style="margin:8px 0 0">Start: ' + longDate(fromKey(a.start)) + ' ' + fromKey(a.start).getFullYear() + ' · Ende: ' + longDate(arcInfo().end) + ' ' + arcInfo().end.getFullYear() + '</p></div>' : '')
    + '<div class="field"><label>Woche beginnt am</label><div class="seg" id="s-ws"><button data-v="1" class="' + (state.weekStart === 1 ? 'on' : '') + '">Montag</button><button data-v="0" class="' + (state.weekStart === 0 ? 'on' : '') + '">Sonntag</button></div></div>'
    + '<div class="field"><label>Schneefall</label><div class="seg" id="s-snow"><button data-v="1" class="' + (state.snow ? 'on' : '') + '">An</button><button data-v="0" class="' + (!state.snow ? 'on' : '') + '">Aus</button></div></div>'
    + '<div class="field"><label>Sicherung</label><p class="note" style="margin:0 0 8px">Die Daten liegen nur auf diesem Gerät. Lade ab und zu eine Sicherung herunter.</p>'
    + '<div class="row-btns"><button class="btn ghost" data-act="export">Speichern</button><button class="btn ghost" data-act="import">Laden</button></div></div>'
    + (a ? '<div class="field"><label>Neu anfangen</label><button class="btn danger wide" data-act="new-arc">Neu starten</button><p class="note" style="margin:6px 0 0">Gewohnheiten und Haken bleiben, nur Start und Dauer werden neu festgelegt.</p></div>' : '')
    + '<div class="row-btns" style="margin-top:18px"><button class="btn" data-act="cancel">Fertig</button></div>');
  if($('#s-why')) $('#s-why').oninput = e => { state.arc.why = e.target.value.slice(0,160); save(); render(); };
  if($('#s-len')) $('#s-len').onclick = e => { const b = e.target.closest('button'); if(!b) return; state.arc.days = +b.dataset.v; save(); render(); openSettings(); };
  $('#s-ws').onclick = e => { const b = e.target.closest('button'); if(!b) return; state.weekStart = +b.dataset.v; save(); render(); openSettings(); };
  $('#s-snow').onclick = e => { const b = e.target.closest('button'); if(!b) return; state.snow = b.dataset.v === '1'; save(); render(); openSettings(); };
}
function newArc(){
  openSheet('<h3>Neu starten?</h3><p>Deine Gewohnheiten und alle Haken bleiben erhalten. Du legst nur Start, Dauer und dein Warum neu fest.</p>'
    + '<div class="row-btns"><button class="btn ghost" data-act="cancel">Abbrechen</button><button class="btn" data-act="new-arc-ok">Neu starten</button></div>');
}
function exportData(){
  const blob = new Blob([JSON.stringify({ app:'winterwandel', version:VERSION, exported:new Date().toISOString(), ...state }, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'Winterwandel-Sicherung-' + dkey(today()) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Sicherung gespeichert.');
}
function importData(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    try{
      const s = JSON.parse(await f.text());
      if(!s || !Array.isArray(s.habits) || typeof s.marks !== 'object') throw 0;
      // Zusammenführen: nichts Vorhandenes geht verloren
      const okDate = v => /^\d{4}-\d\d-\d\d$/.test(v);
      if(!state.arc && s.arc && okDate(s.arc.start)) state.arc = { start:s.arc.start, days:Math.max(1, +s.arc.days || 90), why:String(s.arc.why || '').slice(0,160) };
      for(const h of s.habits) if(h && h.id && h.name && !state.habits.some(x => x.id === h.id))
        state.habits.push({ id:String(h.id), name:String(h.name).slice(0,60), color:/^#[0-9a-f]{6}$/i.test(h.color) ? h.color : COLORS[0],
          mode:['daily','days','times'].includes(h.mode) ? h.mode : 'daily', days:Array.isArray(h.days) ? h.days.map(Number).filter(n => n >= 0 && n < 7) : [1,2,3,4,5],
          times:Math.min(7, Math.max(1, +h.times || 3)), created:okDate(h.created) ? h.created : dkey(today()) });
      for(const k in s.marks){ if(!okDate(k) || !Array.isArray(s.marks[k])) continue;
        state.marks[k] = [...new Set([...(state.marks[k] || []), ...s.marks[k].map(String)])]; }
      save(); closeSheet(); render(); toast('Sicherung geladen.');
    }catch(e){ toast('Diese Datei ist keine gültige Sicherung.'); }
  };
  inp.click();
}

/* ---------- Bedienung ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act = b.dataset.act;
  if(act === 'toggle'){
    const h = state.habits.find(x => x.id === b.dataset.id); if(!h) return;
    const k = b.dataset.k; if(k > dkey(today())) return;
    const before = perfect(fromKey(k));
    const on = !isDone(h, k); setDone(h, k, on);
    if(on && navigator.vibrate) navigator.vibrate(12);
    render();
    if(on){ const nb = document.querySelector('[data-act=toggle][data-id="' + h.id + '"][data-k="' + k + '"]'); if(nb) nb.classList.add('pop');
      if(!before && perfect(fromKey(k))) toast(k === dkey(today()) ? 'Perfekter Tag! ❄️' : 'Tag nachgetragen – perfekt.'); }
  }
  else if(act === 'add') editHabit(null);
  else if(act === 'edit') editHabit(b.dataset.id);
  else if(act === 'save') saveDraft();
  else if(act === 'cancel') closeSheet();
  else if(act === 'up') moveHabit(-1);
  else if(act === 'down') moveHabit(1);
  else if(act === 'del') deleteHabit();
  else if(act === 'back') drawEdit();
  else if(act === 'delok') deleteConfirmed();
  else if(act === 'prev'){ viewDay = addDays(viewDay, -1); render(); }
  else if(act === 'next'){ if(viewDay < today()){ viewDay = addDays(viewDay, 1); render(); } }
  else if(act === 'wprev'){ weekOffset++; render(); }
  else if(act === 'wnext'){ if(weekOffset > 0){ weekOffset--; render(); } }
  else if(act === 'export') exportData();
  else if(act === 'import') importData();
  else if(act === 'arc-go') arcGo();
  else if(act === 'new-arc') newArc();
  else if(act === 'new-arc-ok'){ setupWhy = state.arc ? state.arc.why : ''; setupStart = dkey(today()); setupDays = state.arc ? state.arc.days : 90; isNyeSel = false; state.arc = null; save(); closeSheet(); window.scrollTo(0,0); render(); }
});
document.querySelectorAll('nav.bar button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; window.scrollTo(0,0); render(); }));
$('#add-top').onclick = () => editHabit(null);
$('#settings-btn').onclick = openSettings;

// Schnee
(function(){
  const box = $('#snow'), n = Math.min(60, Math.round(innerWidth / 9));
  for(let i=0;i<n;i++){
    const f = document.createElement('i'), s = 1.5 + Math.random()*3;
    f.style.cssText = 'left:' + (Math.random()*100) + '%;--s:' + s + 'px;--o:' + (.15 + Math.random()*.45).toFixed(2) + ';--t:' + (9 + Math.random()*14).toFixed(1) + 's;--d:-' + (Math.random()*20).toFixed(1) + 's;--x:' + ((Math.random()-.5)*80).toFixed(0) + 'px';
    box.appendChild(f);
  }
})();

// Nach Mitternacht oder beim Zurückkehren zur App den Tag aktualisieren
let lastDay = dkey(today());
function dayCheck(){ const k = dkey(today()); if(k !== lastDay){ if(dkey(viewDay) === lastDay) viewDay = today(); lastDay = k; render(); } }
document.addEventListener('visibilitychange', () => { if(!document.hidden && $('#modal').hidden){ state = load(); dayCheck(); render(); } });
setInterval(dayCheck, 60000);
window.addEventListener('storage', e => { if(e.key === KEY){ state = load(); render(); } });

$('#ver').textContent = 'Version ' + VERSION;
render();
</script>
</body>
</html>
